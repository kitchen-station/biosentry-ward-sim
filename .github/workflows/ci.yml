name: ci

# One pipeline: every pull request and every push to main is tested once.
# A push to main then deploys the build to Cloudflare Pages, only if the tests passed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces. Pushes to main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the runner's image the way the server does. Nothing is pushed: a Dockerfile that cannot build fails the pull request.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag biosentry-ward-sim:ci .
      # The image holds the three built programs and the scenario files it is started with.
      - run: docker run --rm biosentry-ward-sim:ci sh -c 'test -f dist/ward/headless.js && test -f dist/compare/compare.js && test -f dist/lab/lab-worker.js && test -d scenarios/hospital'

  # Builds on GitHub and uploads the finished files, so Cloudflare does not run its own build.
  # A missing CLOUDFLARE_API_TOKEN fails this job; it does not skip quietly.
  deploy:
    if: github.event_name == 'push' && github.repository == 'kitchen-station/biosentry-ward-sim'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VITE_ values end up in the public JS. VITE_VIEW_API_URL is the public address of the API, which is
      # not a secret. Never set VITE_INGEST_KEY or any passphrase here. Unset, the site is the standalone demo.
      - run: npm run build
        env:
          VITE_VIEW_API_URL: ${{ vars.VITE_VIEW_API_URL }}
      - run: npx --yes wrangler@4.155.0 pages deploy dist --project-name=biosentry-ward-sim --branch=main --commit-hash=${{ github.sha }}
