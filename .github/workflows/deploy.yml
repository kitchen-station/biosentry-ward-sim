name: deploy

# Builds on GitHub and uploads the finished files to Cloudflare Pages, so
# Cloudflare does not run its own build. Same commands the Cloudflare build ran:
# a failing test means no deploy.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Do not set VITE_API_URL or VITE_INGEST_KEY here: VITE_ values end up in the public JS.
      - run: npx --yes wrangler@4.155.0 pages deploy dist --project-name=biosentry-ward-sim --branch=main --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
